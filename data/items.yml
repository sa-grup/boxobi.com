title : "Mengapa Memilih Box Obi?"
content: |
  Kami memahami betul kebutuhan <strong>tumbuh kembang</strong> si kecil. Setiap produk Box Obi dipilih dengan standar kualitas tinggi dan telah teruji keamanannya. Berikut keunggulan yang membuat Box Obi menjadi pilihan terbaik untuk buah hati Anda.
style: "style1 medium onscroll-fade-in"
items:
  # feature item loop
  - name : "Bahan Premium"
    content : "Menggunakan bahan kain berkualitas tinggi yang lembut, tahan lama, dan aman untuk bayi. Semua produk telah lulus uji keamanan internasional."
    style : "style2 major fa-gem"

  # feature item loop
  - name : "Mudah Dicuci"
    content : "Dapat dicuci dengan mesin cuci dan tahan lama. Warna tidak mudah pudar dan bentuk tetap terjaga setelah berkali-kali dicuci."
    style : "solid style2 major fa-save"
    
  # feature item loop
  - name : "Edukatif"
    content : "Setiap buku dirancang untuk merangsang perkembangan kognitif, motorik halus, dan kemampuan sensorik bayi sesuai tahapan usianya."
    style : "solid style2 major fa-chart-bar"
    
  # feature item loop
  - name : "Gratis Ongkir"
    content : "Nikmati gratis ongkos kirim untuk area Jakarta dan sekitarnya. Untuk luar kota, kami berikan diskon ongkir yang menarik."
    style : "solid style2 major fa-truck"
    
  # feature item loop
  - name : "Konsultasi Gratis"
    content : "Tim ahli kami siap membantu Anda memilih produk yang tepat sesuai usia dan kebutuhan perkembangan si kecil."
    style : "solid style2 major fa-comments"
    
  # feature item loop
  - name : "Garansi Kualitas"
    content : "Kami memberikan garansi penggantian jika ada cacat produksi atau ketidakpuasan dalam 7 hari pertama pembelian."
    style : "style2 major fa-shield-alt"
    