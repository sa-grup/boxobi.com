content: |
  •  Gambar hitam putih dengan aksen merah memiliki pola kompleksitas yang berbeda<br>
  •  Mengeluarkan Crinkly sound saat dipegang anak<br>
  •  Memperkuat daya penglihatan dan pendengaran anak<br>
  •  Memperkuat motorik halus anak<br><br>
  
  •  Bonus Flash Card dan Pouch.<br>
  •  Tersedia Varian: Bentuk, Buah-buahan, Perasaanku, Binatang, dan Angka.<br>
  •  Untuk Hadiah Sudah Termasuk Kartu Ucapan.<br><br>
  
  • Product Dimension (Saat Dilipat in cm) : P 13.5 X L 13.5 X T 7.5<br>
  • Product Dimension (Saat Dipanjangkan in cm) : P 13.5 X L 67 X T 7.5
