title: "Koleksi Buku Kain Kami"
style: "style2 medium lightbox onscroll-fade-in"
content: |
  Jelajahi <strong>koleksi lengkap</strong> buku kain edukatif Box Obi. Setiap produk dirancang dengan penuh perhatian untuk memberikan pengalaman belajar yang optimal bagi bayi Anda. Klik gambar untuk melihat detail produk dan fitur-fitur menarik yang tersedia.
pictures:
  - title: "Buku Kain Hewan Safari"
    content: "Kenalkan si kecil dengan berbagai hewan safari melalui tekstur yang beragam dan warna-warna cerah."
    image: "images/4.webp"
    thumb: "images/4.webp"
    button: "Detail Produk"

  - title: "Buku Kain Angka & Huruf"
    content: "Pembelajaran dasar angka dan huruf dengan aktivitas mencocokkan dan meraba yang menyenangkan."
