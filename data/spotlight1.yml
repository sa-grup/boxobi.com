title : "Buku Kain Edukatif untuk Bayi"
content: |
  <strong>Buku kain</strong> adalah media pembelajaran sempurna untuk bayi Anda. Dengan tekstur lembut dan aman untuk digigit, buku-buku kami dirancang khusus untuk merangsang perkembangan sensorik, motorik, dan kognitif si kecil. Setiap halaman menghadirkan warna-warna cerah, berbagai tekstur menarik, dan aktivitas interaktif yang akan membuat bayi Anda betah bermain sambil belajar. Cocok untuk bayi usia 0-24 bulan.
